# uproxy · 基于 v2rayA 的 Unraid 出网加速
# 代理引擎与 WebUI 由 v2rayA 提供（自带 xray 内核），uproxy 仅做 Unraid 场景化部署与辅助。
# 透明代理（iptables redirect）需要 host 网络 + privileged 才能操作宿主 iptables / netns。
services:
  unraid-uproxy:
    # 直接使用 v2rayA 官方镜像（自带 xray 内核），无需自行构建。
    # 公开镜像，Unraid 机器匿名即可拉取。
    image: ghcr.io/v2raya/v2raya:v2.5.10
    container_name: Unraid-uproxy
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      # v2rayA WebUI/API 监听地址
      V2RAYA_ADDRESS: "0.0.0.0:2017"
      # Unraid 默认用 iptables（非 nftables），关闭以免找不到 table 的故障
      V2RAYA_NFTABLES_SUPPORT: "off"
      TZ: Asia/Shanghai
    volumes:
      # —— v2rayA 透明代理必需 ——
      - /lib/modules:/lib/modules:ro          # 内核模块（iptables / tun）
      - /etc/resolv.conf:/etc/resolv.conf     # 接管系统 DNS 解析
      - /etc/v2raya:/etc/v2raya               # v2rayA 配置持久化
      # —— 宿主注入挂载（可选，仅 Unraid 精细代理注入需要；非 Unraid 可整段删除）——
      - /boot/config:/host/boot/config
      - /etc/docker:/host/etc/docker
      - /usr/local/etc/rc.d:/host/usr/local/etc/rc.d
      - /etc/profile.d:/host/etc/profile.d
      - /etc/wgetrc:/host/etc/wgetrc
      - /etc/unraid-version:/host/etc/unraid-version:ro
      - /etc/os-release:/host/etc/os-release:ro
      # 辅助工具状态目录（宿主机路径，自动创建；v2rayA 真正数据在上面的 /etc/v2raya）
      - ./data:/config
