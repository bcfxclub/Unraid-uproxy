name: publish-dockerhub

# 推送 tag（如 v1.0.0）时自动构建并推送到 Docker Hub。
# 需要先在 Docker Hub 上建好命名空间（如 bcfxclub/uproxy）与仓库，
# 然后在 GitHub 仓库的 Secrets 里配置：
#   - DOCKERHUB_USERNAME  你的 Docker Hub 用户名
#   - DOCKERHUB_TOKEN     Docker Hub 的 Access Token（Settings -> Security & Tokens 生成，
#                         不要用邮箱，登录时会要求邮箱验证，CI 里走 token 更稳）
on:
  push:
    tags:
      - 'v*'   # 形如 v1.0.0、v0.3.1
  # 也允许在 PR / main 上手动触发构建（不推送），方便 CI 预检
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 只有在真正要推送时（push tag）才需要 Docker Hub 凭据；手动触发时可跳过推送
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        if: github.event_name == 'push'
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # 多架构（amd64/arm64）对 Unraid 等 x86 机型足够；保持单架构 amd64 构建最省事。
          # 若需要 arm64（如 Mac M 系测试），去掉 --platform 并在 setup-buildx 后加 buildx create
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ github.event_name == 'push' && format('{0}/{1}', secrets.DOCKERHUB_USERNAME, 'uproxy') }}:latest
            ${{ github.event_name == 'push' && format('{0}/{1}:{2}', secrets.DOCKERHUB_USERNAME, 'uproxy', steps.version.outputs.version) }}

# ============================================================
# 同时推送到 GHCR（ghcr.io/<owner 小写>/uproxy），免 Docker Hub 也能拉。
# 该 job 不需要任何 Secret（用 GITHUB_TOKEN），包名固定为 uproxy（全小写）。
# 首次推送前，去仓库 Settings -> Packages -> General，把 visibility 设为 Public，
# 否则匿名 pull 会 403。
# ============================================================
  publish-ghcr:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        if: github.event_name == 'push'
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # GHCR 包名必须全小写；仓库名 Unraid-uproxy 大写，GHCR 不接受，固定用 uproxy
          tags: |
            ghcr.io/${{ github.repository_owner | lower }}/uproxy:latest
            ghcr.io/${{ github.repository_owner | lower }}/uproxy:${{ steps.version.outputs.version }}
