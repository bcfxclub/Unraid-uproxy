name: publish-dockerhub

# 推送 tag（如 v1.0.0）时自动构建并推送到 Docker Hub。
# 需要先在 Docker Hub 上建好命名空间（如 bcfxclub/uproxy）与仓库，
# 然后在 GitHub 仓库的 Secrets 里配置：
#   - DOCKERHUB_USERNAME  你的 Docker Hub 用户名
#   - DOCKERHUB_TOKEN     Docker Hub 的 Access Token（Settings -> Security & Tokens 生成，
#                         不要用邮箱，登录时会要求邮箱验证，CI 里走 token 更稳）
on:
  # 只在打 tag（v*）时构建推送；main 上的普通 push 不应触发（避免 CI 误推）
  push:
    tags:
      - 'v*'   # 形如 v1.0.0、v0.3.1
  # 手动触发构建（不推送），方便 CI 预检
  workflow_dispatch:

jobs:
  # ============================================================
  # 推送到 Docker Hub（docker.io/bcfx/uproxy）
  # 需要 Secret：DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
  # ============================================================
  build-and-push-dockerhub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/uproxy:latest,${{ secrets.DOCKERHUB_USERNAME }}/uproxy:${{ steps.version.outputs.version }}

  # ============================================================
  # 推送到 GHCR（ghcr.io/bcfxclub/uproxy），无需任何 Secret
  # 包名固定全小写 uproxy（GHCR 不接受大写仓库名）
  # 首次推送前：仓库 Settings → Packages → General → 设 Public
  # ============================================================
  publish-ghcr:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 写死 owner bcfxclub（GitHub 表达式里不支持 shell 管道 | lower）
          tags: ghcr.io/bcfxclub/uproxy:latest,ghcr.io/bcfxclub/uproxy:${{ steps.version.outputs.version }}
